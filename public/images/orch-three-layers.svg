<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="PingFang SC, Hiragino Sans GB, sans-serif">
  <rect width="880" height="440" fill="#f7f9fc"/>
  <text x="440" y="44" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a2b4a">三款工具都在同一层：CLI Agent 的「控制面」</text>
  <text x="440" y="70" text-anchor="middle" font-size="14" fill="#5a6b85">它们不造模型，而是把你已经装好的 CLI 组织起来</text>

  <!-- 第三层：控制面 -->
  <rect x="60" y="96" width="760" height="96" rx="12" fill="#ffe8d6" stroke="#e07b39" stroke-width="2"/>
  <text x="80" y="124" font-size="16" font-weight="bold" fill="#a4501b">③ 控制面（本文主角）</text>
  <g font-size="15" fill="#7a3d14">
    <rect x="80" y="136" width="210" height="42" rx="8" fill="#fff3ea" stroke="#e07b39"/>
    <text x="185" y="162" text-anchor="middle">T3 Code</text>
    <rect x="335" y="136" width="210" height="42" rx="8" fill="#fff3ea" stroke="#e07b39"/>
    <text x="440" y="162" text-anchor="middle">Paseo</text>
    <rect x="590" y="136" width="210" height="42" rx="8" fill="#fff3ea" stroke="#e07b39"/>
    <text x="695" y="162" text-anchor="middle">Orca</text>
  </g>

  <!-- 第二层：CLI harness -->
  <rect x="60" y="212" width="760" height="84" rx="12" fill="#e3f0ff" stroke="#3a7bd5" stroke-width="2"/>
  <text x="80" y="240" font-size="16" font-weight="bold" fill="#1b538f">② CLI Harness（真正干活的）</text>
  <g font-size="14" fill="#1b538f">
    <rect x="80" y="252" width="128" height="34" rx="6" fill="#fff" stroke="#3a7bd5"/>
    <text x="144" y="274" text-anchor="middle">Claude Code</text>
    <rect x="222" y="252" width="100" height="34" rx="6" fill="#fff" stroke="#3a7bd5"/>
    <text x="272" y="274" text-anchor="middle">Codex</text>
    <rect x="336" y="252" width="100" height="34" rx="6" fill="#fff" stroke="#3a7bd5"/>
    <text x="386" y="274" text-anchor="middle">OpenCode</text>
    <rect x="450" y="252" width="92" height="34" rx="6" fill="#fff" stroke="#3a7bd5"/>
    <text x="496" y="274" text-anchor="middle">Cursor</text>
    <rect x="556" y="252" width="92" height="34" rx="6" fill="#fff" stroke="#3a7bd5"/>
    <text x="602" y="274" text-anchor="middle">Copilot</text>
    <rect x="662" y="252" width="138" height="34" rx="6" fill="#fff" stroke="#3a7bd5"/>
    <text x="731" y="274" text-anchor="middle">Pi / Grok …</text>
  </g>

  <!-- 第一层：模型 -->
  <rect x="60" y="316" width="760" height="76" rx="12" fill="#e8f6ec" stroke="#2e9e5b" stroke-width="2"/>
  <text x="80" y="344" font-size="16" font-weight="bold" fill="#1c6b3a">① 推理模型（按你自己的订阅计费）</text>
  <text x="80" y="372" font-size="14" fill="#1c6b3a">Claude · GPT · Gemini …　控制面不转售 token，只负责调度与展示</text>

  <text x="440" y="420" text-anchor="middle" font-size="13" fill="#8794a8">适配器把各家事件归一 → 一个界面管多种 agent</text>
</svg>
