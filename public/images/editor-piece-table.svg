<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="PingFang SC, Hiragino Sans GB, sans-serif">
  <rect width="880" height="420" fill="#f7f9fc"/>
  <text x="440" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a2b4a">Piece Table：原文永不修改，编辑只追加</text>
  <text x="440" y="66" text-anchor="middle" font-size="14" fill="#5a6b85">初始文本 "hello world"，在位置 5 插入 "," 后</text>

  <text x="60" y="112" font-size="16" font-weight="bold" fill="#1c6b3a">原始缓冲区 origin（只读）</text>
  <rect x="60" y="126" width="360" height="52" rx="8" fill="#e8f6ec" stroke="#2e9e5b" stroke-width="2"/>
  <g font-size="18" fill="#1c6b3a" text-anchor="middle">
    <text x="96" y="159">h</text><text x="132" y="159">e</text><text x="168" y="159">l</text>
    <text x="204" y="159">l</text><text x="240" y="159">o</text><text x="276" y="159"> </text>
    <text x="312" y="159">w</text><text x="348" y="159">o</text><text x="384" y="159">r</text>
  </g>

  <text x="460" y="112" font-size="16" font-weight="bold" fill="#9a5a10">追加缓冲区 add（只增不删）</text>
  <rect x="460" y="126" width="120" height="52" rx="8" fill="#fff1dc" stroke="#e08a2e" stroke-width="2"/>
  <text x="520" y="159" text-anchor="middle" font-size="18" fill="#9a5a10">,</text>

  <line x1="440" y1="210" x2="440" y2="240" stroke="#8794a8" stroke-width="2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8794a8"/></marker></defs>

  <text x="60" y="268" font-size="16" font-weight="bold" fill="#1b538f">Piece 序列（逻辑视图 = 拼接各 piece）</text>
  <rect x="60" y="284" width="180" height="56" rx="8" fill="#e9f3ff" stroke="#3a7bd5"/>
  <text x="150" y="307" text-anchor="middle" font-size="14" fill="#1b538f">origin[0,5)</text>
  <text x="150" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b538f">"hello"</text>
  <rect x="252" y="284" width="140" height="56" rx="8" fill="#fff1dc" stroke="#e08a2e"/>
  <text x="322" y="307" text-anchor="middle" font-size="14" fill="#9a5a10">add[0,1)</text>
  <text x="322" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a5a10">","</text>
  <rect x="404" y="284" width="240" height="56" rx="8" fill="#e9f3ff" stroke="#3a7bd5"/>
  <text x="524" y="307" text-anchor="middle" font-size="14" fill="#1b538f">origin[5,11)</text>
  <text x="524" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b538f">" world"</text>
  <text x="676" y="319" font-size="20" fill="#1a2b4a">→ hello, world</text>

  <rect x="60" y="368" width="760" height="34" rx="8" fill="#fff" stroke="#c9d4e4"/>
  <text x="76" y="390" font-size="14" fill="#3c4757">删除 = 移除/裁剪 piece；撤销 = 存一份 piece 快照。都不碰原始字符，所以超大文件也只在 O(piece 数) 内操作。</text>
</svg>
