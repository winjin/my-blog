<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="PingFang SC, Hiragino Sans GB, sans-serif">
  <rect width="880" height="440" fill="#f7f9fc"/>
  <text x="440" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a2b4a">编辑器里的 AI Agent：ReAct 循环</text>
  <text x="440" y="66" text-anchor="middle" font-size="14" fill="#5a6b85">模型不是一次吐出全部代码，而是「观察 → 思考 → 调工具 → 再看结果」反复迭代</text>

  <defs><marker id="a2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a32d2a"/></marker></defs>

  <rect x="60" y="100" width="180" height="72" rx="12" fill="#fde8e8" stroke="#d9534f" stroke-width="2"/>
  <text x="150" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#a32d2a">① 观察 Observation</text>
  <text x="150" y="153" text-anchor="middle" font-size="13" fill="#8b2b28">文件树 / 选中代码 / 报错</text>

  <rect x="350" y="100" width="180" height="72" rx="12" fill="#fff1dc" stroke="#e08a2e" stroke-width="2"/>
  <text x="440" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a5a10">② 思考 Thought</text>
  <text x="440" y="153" text-anchor="middle" font-size="13" fill="#8a5312">LLM 规划下一步动作</text>

  <rect x="640" y="100" width="180" height="72" rx="12" fill="#e9f3ff" stroke="#3a7bd5" stroke-width="2"/>
  <text x="730" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b538f">③ 工具 Tool Call</text>
  <text x="730" y="153" text-anchor="middle" font-size="13" fill="#1b538f">读文件 / 搜索 / 编辑 / 测试</text>

  <line x1="240" y1="136" x2="344" y2="136" stroke="#a32d2a" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="530" y1="136" x2="634" y2="136" stroke="#a32d2a" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M730 172 C730 230 150 230 150 176" fill="none" stroke="#a32d2a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a2)"/>
  <text x="440" y="212" text-anchor="middle" font-size="13" fill="#a32d2a">工具结果回填上下文，进入下一轮（直到目标达成或超步数上限）</text>

  <rect x="60" y="300" width="760" height="112" rx="12" fill="#fff" stroke="#c9d4e4" stroke-width="2"/>
  <text x="80" y="328" font-size="15" font-weight="bold" fill="#1a2b4a">编辑器要额外提供的「护栏」</text>
  <g font-size="13" fill="#3c4757">
    <rect x="80" y="342" width="220" height="52" rx="8" fill="#e8f6ec" stroke="#2e9e5b"/>
    <text x="190" y="364" text-anchor="middle" font-weight="bold" fill="#1c6b3a">权限与沙箱</text>
    <text x="190" y="383" text-anchor="middle">读/写/执行命令分级授权</text>
    <rect x="330" y="342" width="220" height="52" rx="8" fill="#fff1dc" stroke="#e08a2e"/>
    <text x="440" y="364" text-anchor="middle" font-weight="bold" fill="#9a5a10">Diff 审阅</text>
    <text x="440" y="383" text-anchor="middle">改动先给人看，可一键回滚</text>
    <rect x="580" y="342" width="220" height="52" rx="8" fill="#e9f3ff" stroke="#3a7bd5"/>
    <text x="690" y="364" text-anchor="middle" font-weight="bold" fill="#1b538f">预算与终止</text>
    <text x="690" y="383" text-anchor="middle">步数 / token / 时间上限</text>
  </g>
</svg>
