<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#f8fafc"/>
  <text x="40" y="52" font-size="30" font-weight="bold" fill="#0f172a" font-family="PingFang SC, Hiragino Sans GB, sans-serif">一份「AI 读得懂」的 AGENTS.md 长什么样</text>

  <rect x="40" y="78" width="1120" height="410" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif">
    <text x="68" y="118" font-size="20" font-weight="bold" fill="#1e293b"># AGENTS.md</text>
    <line x1="68" y1="132" x2="1132" y2="132" stroke="#e2e8f0"/>

    <rect x="68" y="146" width="112" height="30" rx="6" fill="#dbeafe"/>
    <text x="80" y="167" font-size="17" font-weight="bold" fill="#1e40af">项目概览</text>
    <text x="196" y="167" font-size="17" fill="#475569">一句话说清项目是什么、给谁用</text>

    <rect x="68" y="192" width="112" height="30" rx="6" fill="#dcfce7"/>
    <text x="80" y="213" font-size="17" font-weight="bold" fill="#166534">构建 / 测试</text>
    <text x="196" y="213" font-size="17" fill="#475569">可直接复制粘贴的命令，带参数</text>

    <rect x="68" y="238" width="112" height="30" rx="6" fill="#fef3c7"/>
    <text x="80" y="259" font-size="17" font-weight="bold" fill="#92400e">目录约定</text>
    <text x="196" y="259" font-size="17" fill="#475569">哪些能改、哪些是产物、放哪里</text>

    <rect x="68" y="284" width="112" height="30" rx="6" fill="#ede9fe"/>
    <text x="80" y="305" font-size="17" font-weight="bold" fill="#5b21b6">代码风格</text>
    <text x="196" y="305" font-size="17" fill="#475569">命名、类型、日志、错误处理的硬规则</text>

    <rect x="68" y="330" width="112" height="30" rx="6" fill="#ffe4e6"/>
    <text x="80" y="351" font-size="17" font-weight="bold" fill="#9f1239">提交规范</text>
    <text x="196" y="351" font-size="17" fill="#475569">message 格式、何时 squash、分支策略</text>

    <rect x="68" y="376" width="112" height="30" rx="6" fill="#cffafe"/>
    <text x="80" y="397" font-size="17" font-weight="bold" fill="#155e75">禁止事项</text>
    <text x="196" y="397" font-size="17" fill="#475569">明确红线：不要碰的目录与操作</text>
  </g>
  <line x1="68" y1="424" x2="1132" y2="424" stroke="#e2e8f0"/>
  <text x="68" y="458" font-size="18" font-weight="bold" fill="#0f172a" font-family="PingFang SC, Hiragino Sans GB, sans-serif">原则：短、具体、可执行。一条「跑 npm test」胜过三段「请保持代码质量」。</text>
</svg>
